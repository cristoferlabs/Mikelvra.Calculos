name: Daily open data

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-open-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch open data → JSON (solo script permitido)
        env:
          AFP_JSON_URL: ${{ secrets.AFP_JSON_URL }}
          npm_config_ignore_scripts: "true"
        run: |
          set -euo pipefail
          test -f scripts/fetch-open-data.mjs
          test "$(find scripts -maxdepth 1 -type f ! -name 'fetch-open-data.mjs' | wc -l)" -eq 0 \
            || { echo "::error::Hay archivos inesperados en scripts/. Abortando."; ls -la scripts; exit 1; }
          node scripts/fetch-open-data.mjs

      - name: Commit data if changed
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/normativa.json data/noticias.json data/calendario.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Sin cambios en data/"
          else
            git commit -m "chore(data): refresh open data $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy FTPS (si hay cambios o manual)
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          protocol: ftps
          security: loose
          port: 21
          timeout: 190000
          log-level: verbose
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/scripts/**
            **/package*.json
            **/.npmrc
            **/.claude/**
            **/.cursor/**
            **/README.md
            **/mvp-firma-de-documento/**
            **/.env
            **/.env.*
            **/*.pem
            **/*.key
            **/*secret*
            **/credentials.json
            **/docs/**
            **/run.bat
