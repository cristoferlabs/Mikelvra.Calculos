name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ftp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validar secrets FTP
        run: |
          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta el secret $name en Settings → Secrets"
              missing=1
            fi
          done
          # Aviso si el server parece URL web (causa típica de timeout)
          case "${FTP_SERVER}" in
            http://*|https://*|www.*)
              echo "::error::FTP_SERVER no debe ser una URL web. Usa el host FTP de cPanel (ej. ftp.mikelvra.com), sin https://"
              missing=1
              ;;
          esac
          exit $missing
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

      - name: Deploy via FTPS to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Si el usuario FTP ya entra en public_html → ./
          # Si usas la cuenta principal → public_html/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          protocol: ftps
          security: loose
          port: 21
          timeout: 190000
          log-level: verbose
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/scripts/**
            **/package*.json
            **/.npmrc
            **/.claude/**
            **/.cursor/**
            **/README.md
            **/mvp-firma-de-documento/**
            **/.env
            **/.env.*
            **/*.pem
            **/*.key
            **/*secret*
            **/credentials.json
            **/docs/**
            **/run.bat
