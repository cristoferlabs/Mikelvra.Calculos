name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Mínimos privilegios: solo lee el repo; secretos FTP vienen de GitHub Secrets
permissions:
  contents: read

concurrency:
  group: deploy-ftp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validar secrets FTP
        run: |
          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            # No imprime el valor; solo comprueba que exista
            if [ -z "${!name}" ]; then
              echo "::error::Falta el secret $name en Settings → Secrets"
              missing=1
            fi
          done
          exit $missing
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}

      - name: Deploy via FTP to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol: ftp
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/scripts/**
            **/package*.json
            **/.npmrc
            **/.claude/**
            **/.cursor/**
            **/README.md
            **/mvp-firma-de-documento/**
            **/.env
            **/.env.*
            **/*.pem
            **/*.key
            **/*secret*
            **/credentials.json
            **/docs/**
            **/run.bat
