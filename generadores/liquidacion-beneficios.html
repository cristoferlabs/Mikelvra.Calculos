<!DOCTYPE html>
<html lang="es-PE">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquidación de beneficios con firma | Mikelvra</title>
  <meta name="description" content="Hoja de liquidación simple en blanco y negro con firma." />
  <link rel="canonical" href="https://mikelvra.com/generadores/liquidacion-beneficios.html" />
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <script src="/assets/js/calculadoras.js"></script>
  <script src="/assets/js/ui-helpers.js"></script>
  <script src="/assets/js/documentos.js"></script>
  <script src="/assets/js/firma.js"></script>
</head>
<body class="page-generator">
  <div class="app-shell">
    <div id="site-header"></div>
    <div class="main-area">
      <main class="content">
        <div class="breadcrumb no-print"><a href="/index.html">Inicio</a> / Liquidación de beneficios</div>
        <div class="page-header no-print">
          <h1>Liquidación de beneficios</h1>
          <p class="lead">Completa los datos. La vista previa se actualiza al instante. Firma sin marco.</p>
        </div>
        <div class="gen-layout">
          <section class="gen-form no-print" id="formPanel">
            <h2 class="gen-panel-title"><span class="gen-ico" aria-hidden="true">S/</span> Datos de la liquidación</h2>
            <div class="form-group"><label for="nombre">Trabajador</label><input type="text" id="nombre" /></div>
            <div class="form-group"><label for="dni">DNI</label><input type="text" id="dni" inputmode="numeric" /></div>
            <div class="form-group"><label for="empresa">Empresa</label><input type="text" id="empresa" /></div>
            <div class="form-group"><label for="sueldo">Sueldo básico (S/)</label><input type="number" id="sueldo" min="0" step="0.01" /></div>
            <div class="form-group"><label class="checkbox-row"><input type="checkbox" id="tieneAsignacion" /> Asignación familiar</label></div>
            <div class="form-group"><label for="fechaIngreso">Fecha de ingreso</label><input type="date" id="fechaIngreso" /></div>
            <div class="form-group"><label for="fechaCese">Fecha de cese</label><input type="date" id="fechaCese" /></div>
            <div class="form-group">
              <label for="regimenSalud">Régimen de salud (bono)</label>
              <select id="regimenSalud">
                <option value="0.09" selected>EsSalud (9%)</option>
                <option value="0.0675">EPS (6.75%)</option>
              </select>
            </div>
            <p class="gen-section-label">Firma</p>
            <div class="sig-panel">
              <p>Firma del trabajador.</p>
              <div class="sig-canvas-wrap"><canvas id="sigCanvas" width="640" height="200"></canvas></div>
              <div class="sig-actions"><button type="button" class="btn-secondary btn-sm" id="btnClearFirma">Borrar firma</button></div>
            </div>
            <div class="gen-actions"><button type="button" class="btn" data-action="pdf" data-target="resultado">Descargar PDF</button></div>
          </section>
          <section class="gen-preview-card">
            <p class="vista-previa-label no-print">📄 Vista previa</p>
            <div class="result-box visible" id="resultado"><div class="doc-preview" id="preview"></div></div>
          </section>
        </div>
      </main>
      <div id="site-footer"></div>
    </div>
  </div>
  <script src="/assets/js/navbar.js"></script>
  <script src="/assets/js/include.js"></script>
  <script>
    var firmaUrl = "";
    var pad = Firma.createPad(document.getElementById("sigCanvas"));
    pad.onChange(function () { firmaUrl = pad.isEmpty() ? "" : pad.getDataURL(); build(); });
    document.getElementById("btnClearFirma").addEventListener("click", function () { pad.clear(); firmaUrl = ""; build(); });
    function build() {
      var sueldo = parseFloat(document.getElementById("sueldo").value) || 0;
      var fi = document.getElementById("fechaIngreso").value;
      var fc = document.getElementById("fechaCese").value;
      if (!(sueldo > 0 && fi && fc)) {
        document.getElementById("preview").innerHTML =
          "<p style=\"color:#666;font-family:Sora,sans-serif\">Completa sueldo, fecha de ingreso y fecha de cese para ver la hoja y descargar el PDF.</p>";
        document.getElementById("resultado").classList.remove("visible");
        UI.syncExportButtons("resultado");
        return;
      }
      var calc = Calc.calcularLiquidacion({
        sueldo: sueldo,
        tieneAsignacion: document.getElementById("tieneAsignacion").checked,
        tasaBono: parseFloat(document.getElementById("regimenSalud").value) || 0.09,
        fechaIngreso: Calc.parseFechaISO(fi),
        fechaCese: Calc.parseFechaISO(fc),
      });
      Docs.renderPreview(document.getElementById("preview"), Docs.liquidacionBeneficios({
        nombre: document.getElementById("nombre").value || "[Trabajador]",
        dni: document.getElementById("dni").value || "—",
        empresa: document.getElementById("empresa").value || "[Empresa]",
        sueldo: sueldo,
        fechaIngreso: fi,
        fechaCese: fc,
        fechaDoc: fc,
        firmaDataUrl: firmaUrl,
      }, calc));
      UI.setResultVisible("resultado", true);
    }
    UI.prefillsueldo("sueldo");
    UI.wireLiveInputs(document.getElementById("formPanel"), build);
    UI.wireResultExport("resultado");
    build();
  </script>
</body>
</html>
