<!DOCTYPE html>
<html lang="es-PE">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recibo de dinero con firma | Mikelvra</title>
  <meta name="description" content="Recibo de dinero simple con firma manuscrita. Blanco y negro." />
  <link rel="canonical" href="https://mikelvra.com/generadores/recibo-dinero.html" />
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <script src="/assets/js/ui-helpers.js"></script>
  <script src="/assets/js/documentos.js"></script>
  <script src="/assets/js/firma.js"></script>
</head>
<body class="page-generator">
  <div class="app-shell">
    <div id="site-header"></div>
    <div class="main-area">
      <main class="content">
        <div class="breadcrumb no-print"><a href="/index.html">Inicio</a> / Recibo de dinero</div>
        <div class="page-header no-print">
          <h1>Recibo de dinero</h1>
          <p class="lead">Completa los datos. La vista previa se actualiza al instante. Firma sin marco.</p>
        </div>
        <div class="gen-layout">
          <section class="gen-form no-print" id="formPanel">
            <h2 class="gen-panel-title"><span class="gen-ico" aria-hidden="true">✎</span> Datos del recibo</h2>
            <div class="form-group"><label for="receptor">Quien recibe</label><input type="text" id="receptor" /></div>
            <div class="form-group"><label for="dniReceptor">DNI de quien recibe</label><input type="text" id="dniReceptor" inputmode="numeric" /></div>
            <div class="form-group"><label for="pagador">Quien paga</label><input type="text" id="pagador" /></div>
            <div class="form-group"><label for="monto">Monto (S/)</label><input type="number" id="monto" min="0" step="0.01" /></div>
            <div class="form-group"><label for="concepto">Concepto</label><input type="text" id="concepto" /></div>
            <div class="form-group"><label for="ciudad">Ciudad</label><input type="text" id="ciudad" value="Lima" /></div>
            <div class="form-group"><label for="fecha">Fecha</label><input type="date" id="fecha" /></div>
            <p class="gen-section-label">Firma</p>
            <div class="sig-panel">
              <p>Firma de quien recibe.</p>
              <div class="sig-canvas-wrap"><canvas id="sigCanvas" width="640" height="200"></canvas></div>
              <div class="sig-actions"><button type="button" class="btn-secondary btn-sm" id="btnClearFirma">Borrar firma</button></div>
            </div>
            <div class="gen-actions"><button type="button" class="btn" data-action="pdf" data-target="resultado">Descargar PDF</button></div>
          </section>
          <section class="gen-preview-card">
            <p class="vista-previa-label no-print">📄 Vista previa</p>
            <div class="result-box visible" id="resultado"><div class="doc-preview" id="preview"></div></div>
          </section>
        </div>
      </main>
      <div id="site-footer"></div>
    </div>
  </div>
  <script src="/assets/js/navbar.js"></script>
  <script src="/assets/js/include.js"></script>
  <script>
    document.getElementById("fecha").value = new Date().toISOString().slice(0, 10);
    var firmaUrl = "";
    var pad = Firma.createPad(document.getElementById("sigCanvas"));
    pad.onChange(function () { firmaUrl = pad.isEmpty() ? "" : pad.getDataURL(); build(); });
    document.getElementById("btnClearFirma").addEventListener("click", function () { pad.clear(); firmaUrl = ""; build(); });
    function build() {
      Docs.renderPreview(document.getElementById("preview"), Docs.reciboDinero({
        receptor: document.getElementById("receptor").value || "[Receptor]",
        dniReceptor: document.getElementById("dniReceptor").value || "________",
        pagador: document.getElementById("pagador").value || "[Pagador]",
        monto: parseFloat(document.getElementById("monto").value) || 0,
        concepto: document.getElementById("concepto").value || "[Concepto]",
        ciudad: document.getElementById("ciudad").value,
        fecha: document.getElementById("fecha").value,
        firmaDataUrl: firmaUrl,
      }));
    }
    UI.wireLiveInputs(document.getElementById("formPanel"), build);
    UI.wireResultExport("resultado");
    build();
  </script>
</body>
</html>
